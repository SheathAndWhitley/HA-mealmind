<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MealMind{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">MealMind</a>
    <nav>
      <div class="toggle" role="group" aria-label="Recipe layout">
        <a class="{{ 'on' if view == 'normal' }}" href="{{ url_for('set_view', mode='normal', next=request.full_path) }}">Normal</a>
        <a class="{{ 'on' if view == 'engineering' }}" href="{{ url_for('set_view', mode='engineering', next=request.full_path) }}">Engineering</a>
      </div>
      <a href="{{ url_for('index') }}">Recipes</a>
      <a class="button" href="{{ url_for('add') }}">+ Add recipe</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
